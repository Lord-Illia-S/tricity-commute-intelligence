[project]
name = "tricity-commute-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "gtfs-realtime-bindings>=3.0.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
