version: 2

models:
  - name: stg_stops
    columns:
      - name: stop_id
        tests: [not_null]
      - name: city
        tests:
          - not_null
          - accepted_values:
              values: ['gdansk', 'gdynia']
  - name: stg_routes
    columns:
      - name: route_id
        tests: [ not_null ]
      - name: city
        tests:
          - not_null
          - accepted_values:
              values: [ 'gdansk', 'gdynia' ]
  - name: stg_trips
    columns:
      - name: route_id
        tests: [ not_null ]
      - name: trip_id
        tests: [ not_null ]
      - name: city
        tests:
          - not_null
          - accepted_values:
              values: [ 'gdansk', 'gdynia' ]
  - name: stg_stop_times
    columns:
      - name: trip_id
        tests: [ not_null ]
      - name: stop_id
        tests: [ not_null ]
      - name: city
        tests:
          - not_null
          - accepted_values:
              values: [ 'gdansk', 'gdynia' ]
